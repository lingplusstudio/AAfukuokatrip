<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ariel＋Amy 福岡親子雙家庭 6天5夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --ink:#3E3A39;
  --coral:#F2A497; --yellow:#F6D27A; --blue:#A8D3E6; --green:#B9DAA5;
  --bw:3px; --r:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{font-family:'Huninn','Noto Sans TC','PingFang TC',sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;font-size:16px;padding-top:60px}
a{color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
section{padding:28px 0 8px}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--paper);border-bottom:var(--bw) solid var(--ink)}
nav .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;font-size:.95rem;padding:3px 13px;border:var(--bw) solid transparent;border-radius:999px;white-space:nowrap}
nav a.brand{border-color:var(--ink);background:var(--coral);margin-right:4px}
nav a.on{border-color:var(--ink);background:var(--yellow)}

h2{display:inline-block;font-size:1.25rem;font-weight:400;padding:2px 16px;border:var(--bw) solid var(--ink);border-radius:999px;margin-bottom:14px}
.card{border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:0 5px 0 var(--ink)}
.todo-text{font-size:.9rem}
.pending{display:inline-block;border:2px dashed var(--ink);border-radius:999px;padding:0 10px;font-size:.85rem;background:var(--paper)}

/* hero */
.hero{margin-top:16px;overflow:hidden}
.hero svg{display:block;width:100%;height:auto;border-bottom:var(--bw) solid var(--ink)}
.hero .txt{padding:16px 18px 20px;text-align:center}
.hero h1{font-size:1.9rem;font-weight:400;line-height:1.25;text-wrap:balance}
.hero p.sub{margin-top:4px;font-size:.95rem}
.cd-label{margin-top:14px;font-size:.95rem}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.cd div{border:var(--bw) solid var(--ink);border-radius:18px;padding:6px 0 4px}
.cd div:nth-child(1){background:var(--coral)}
.cd div:nth-child(2){background:var(--yellow)}
.cd div:nth-child(3){background:var(--blue)}
.cd div:nth-child(4){background:var(--green)}
.cd b{display:block;font-weight:400;font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums}
.cd span{font-size:.8rem}
.cd-msg{display:none;margin-top:14px;font-size:1.15rem;padding:8px;border:var(--bw) solid var(--ink);border-radius:18px;background:var(--yellow)}

/* flights */
.ticket{display:flex;margin-bottom:18px;overflow:hidden}
.ticket .side{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-right:var(--bw) dashed var(--ink);padding:10px 4px}
.ticket.go .side{background:var(--blue)}
.ticket.back .side{background:var(--coral)}
.ticket .side small{font-size:.8rem}
.ticket .side svg{width:38px;height:38px}
.ticket .body{flex:1;padding:12px 14px;min-width:0}
.route{font-size:1.15rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.route i{font-style:normal;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--yellow);font-size:.85rem}
.rows{margin-top:6px;display:grid;gap:3px;font-size:.92rem}
.rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:2px dotted var(--ink);padding-bottom:2px}
.rows div:last-child{border-bottom:0}
.rows em{font-style:normal}

/* days */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;scroll-snap-align:center;font:inherit;color:inherit;cursor:pointer;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:20px;padding:5px 14px 4px;text-align:center;min-width:68px}
.tab b{display:block;font-weight:400;font-size:1.05rem;line-height:1.3}
.tab span{font-size:.78rem}
.tab[aria-selected="true"]{background:var(--yellow);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.tab.bounce{animation:tabpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabpop{0%{transform:translateY(0) scale(.9)}60%{transform:translateY(-6px) scale(1.08)}100%{transform:translateY(-2px) scale(1)}}

.panel{margin-top:6px}
.panel.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.94)}60%{opacity:1;transform:translateY(-5px) scale(1.015)}100%{opacity:1;transform:none}}
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead .ic{flex:0 0 64px;width:64px;height:64px;border:var(--bw) solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.dayhead .ic svg{width:48px;height:48px}
.dayhead h3{font-weight:400;font-size:1.2rem;line-height:1.3;text-wrap:balance}
.dayhead small{font-size:.9rem}
.note{margin-top:14px;padding:10px 14px;border:var(--bw) solid var(--ink);border-radius:20px;background:var(--green);font-size:.95rem}
.tl{list-style:none;position:relative;margin-top:18px}
.tl::before{content:"";position:absolute;left:11px;top:10px;bottom:20px;border-left:var(--bw) dashed var(--ink)}
.tl li{position:relative;padding-left:42px;margin-bottom:14px;--c:var(--yellow)}
.tl li.p2{--c:var(--blue)} .tl li.p3{--c:var(--coral)}
.tl li::before{content:"";position:absolute;left:0;top:12px;width:25px;height:25px;border:var(--bw) solid var(--ink);border-radius:50%;background:var(--c)}
.it{position:relative;border:var(--bw) solid var(--ink);border-radius:20px;padding:10px 14px 12px;background:var(--paper)}
.it.must{background:var(--yellow);box-shadow:0 4px 0 var(--ink)}
.pc{display:inline-block;font-size:.8rem;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--c);margin-right:4px}
.it h4{font-weight:400;font-size:1.08rem;margin-top:4px;line-height:1.4}
.it p{font-size:.9rem;margin-top:2px}
.tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;border:2px solid var(--ink);border-radius:999px;padding:0 10px}
.tag.walk{background:var(--green)} .tag.metro{background:var(--blue)} .tag.train{background:var(--yellow)}
.tag.bus{background:var(--coral)} .tag.plane{background:var(--paper)}
.badge{position:absolute;right:-6px;top:-14px;background:var(--coral);border:var(--bw) solid var(--ink);border-radius:999px;padding:0 12px;font-size:.9rem;transform:rotate(5deg);animation:wig 2.8s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-4deg) scale(1.06)}}
.foot{font-size:.82rem;margin-top:6px}

/* todo */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.92rem}
.bar{flex:1;height:18px;border:var(--bw) solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;width:0;background:var(--green);border-right:var(--bw) solid var(--ink);transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.bar i[style*="width: 0%"],.bar i[style*="width:0%"]{border-right:0}
.todo{list-style:none;display:grid;gap:10px}
.todo .lb{display:flex;gap:12px;align-items:center;border:var(--bw) solid var(--ink);border-radius:18px;padding:9px 14px;cursor:pointer;background:var(--paper);line-height:1.4}
.todo input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:0 0 26px;width:26px;height:26px;border:var(--bw) solid var(--ink);border-radius:9px;background:var(--paper);display:grid;place-items:center}
.box svg{width:18px;height:18px;opacity:0;transform:scale(.3)}
.todo input:checked + .box{background:var(--green)}
.todo input:checked + .box svg{opacity:1;transform:scale(1);transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .15s}
.todo input:checked ~ .tx{text-decoration:line-through;text-decoration-thickness:2px}
.todo input:focus-visible + .box{outline:3px dashed var(--ink);outline-offset:3px}

.ticket.back .side svg{transform:scaleX(-1)}
.who{margin-top:12px;font-size:.92rem}
.who + .dates{margin-top:4px}
.ticket .side small{text-align:center}

/* stay */
.stay{padding:16px 18px}
.stay h3{font-weight:400;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.stay h3 svg{width:40px;height:40px;flex:0 0 40px}
.dates{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px;text-align:center}
.dates div{border:var(--bw) solid var(--ink);border-radius:18px;padding:6px 4px}
.dates div:first-child{background:var(--blue)} .dates div:last-child{background:var(--coral)}
.dates small{display:block;font-size:.8rem}
.dates .n{border:0;padding:0;font-size:.9rem}
.stay dl{margin-top:12px;display:grid;gap:6px;font-size:.92rem}
.stay dl div{display:flex;gap:10px;border-bottom:2px dotted var(--ink);padding-bottom:4px}
.stay dt{flex:0 0 4.5em}
.stay dd{flex:1}

footer{text-align:center;font-size:.85rem;padding:30px 16px 40px}

/* svg motion */
.drift{animation:drift 7s ease-in-out infinite alternate}
.drift.b{animation-duration:9s;animation-delay:-3s}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
.fly{animation:fly 20s linear infinite}
@keyframes fly{from{transform:translateX(-90px)}to{transform:translateX(450px)}}
.bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{animation:wave 4s ease-in-out infinite alternate}
.wave.b{animation-delay:-2s}
@keyframes wave{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.train{animation:train 14s ease-in-out infinite alternate}
@keyframes train{from{transform:translateX(0)}to{transform:translateX(120px)}}
.blink{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.tag.taxi{background:var(--paper);border-style:dashed}
.editBtn{margin-left:auto;flex:0 0 auto;font-family:inherit;font-size:.95rem;color:inherit;cursor:pointer;background:var(--green);border:var(--bw) solid var(--ink);border-radius:999px;padding:3px 14px}
#edtool{margin-top:12px;padding:12px 14px;background:var(--yellow)}
#edtool p{font-size:.88rem;margin-bottom:6px}
#edtool button,.ed{font-family:inherit;font-size:.85rem;color:inherit;cursor:pointer;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:1px 12px;margin:3px 4px 3px 0}
.ed.add{border-style:dashed;background:var(--green)} .ed.del{background:var(--coral)} .ed.x{padding:0 8px;margin-left:6px}
.editing .e{outline:2px dashed var(--ink);outline-offset:2px;display:inline-block;min-width:1.5em;padding:0 2px;cursor:text;border-radius:6px}
.editing .e:empty::before{content:attr(data-ph) "…";opacity:.45}
.edbar{margin:8px 0;font-size:.9rem}
.ctl{margin-top:8px}
.tag.off{opacity:.35}
button.tag,button.pc{font-family:inherit;color:inherit;cursor:pointer}
.edli{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.edli .lb{flex:1 1 220px}
.edrow{display:block;font-size:.9rem;margin-top:8px}
.edrow input{font-family:inherit;font-size:1rem;border:var(--bw) solid var(--ink);border-radius:14px;padding:4px 10px;background:var(--paper)}
.dayhead .ic[data-act]{cursor:pointer}
.todo li.sh{display:flex;gap:6px;align-items:center}
.todo li.sh .lb{flex:1;min-width:0}
.todo input:disabled + .box{opacity:.55}
.wp{display:inline-block;font-size:.75rem;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--blue);margin-left:8px;line-height:1.5}
.addrow{display:flex;gap:8px;margin:12px 0 4px}
.addrow input{flex:1;min-width:0;font-family:inherit;font-size:1rem;color:var(--ink);border:var(--bw) solid var(--ink);border-radius:18px;padding:8px 14px;background:var(--paper)}
.addrow button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer;border:var(--bw) solid var(--ink);border-radius:18px;padding:0 16px;background:var(--yellow)}
.msg{border:var(--bw) solid var(--ink);border-radius:20px;padding:8px 14px;margin-top:10px;overflow-wrap:anywhere}
.msg small{font-size:.8rem}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 10px 1px 7px}
.tag svg{width:16px;height:16px;flex:none;fill:none;stroke:#3E3A39;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tag.train svg{animation:tgx 1.1s ease-in-out infinite alternate}
.tag.plane svg{animation:tgy 2s ease-in-out infinite alternate}
@keyframes tgx{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes tgy{from{transform:translateY(1px) rotate(-4deg)}to{transform:translateY(-2px) rotate(4deg)}}
.snow circle{animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,calc(-14px - var(--y)))}to{transform:translate(14px,calc(256px - var(--y)))}}
.fly2{transform:translateX(430px);animation:fly2 30s linear infinite;animation-delay:-9s}
@keyframes fly2{from{transform:translateX(430px)}to{transform:translateX(-110px)}}
.panel{position:relative}
.tab{position:relative}
#plan .tabs{padding-top:20px;margin-top:-12px}
.tabhat{position:absolute;top:-17px;right:3px;width:27px;height:24px;transform-origin:50% 100%;pointer-events:none;animation:wob 2.6s ease-in-out infinite alternate}
.tabhat svg{width:100%;height:100%;display:block}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.mp{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:.8rem;border:2.5px solid var(--ink);border-radius:999px;padding:0 10px 0 6px;background:var(--blue);text-decoration:none;color:inherit}
.mp svg{width:14px;height:14px;fill:none;stroke:#3E3A39;stroke-width:2.2;stroke-linejoin:round}
.fg{display:inline-block;font-weight:400;font-size:1rem;margin:16px 6px 8px 0;border:var(--bw) solid var(--ink);border-radius:999px;padding:0 14px;background:var(--yellow)}
.todo .tx small{display:block;font-size:.82rem;line-height:1.45;margin-top:2px}
.tips{list-style:disc;padding-left:1.3em;display:grid;gap:6px;font-size:.9rem;margin-top:4px}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (min-width:560px){ body{font-size:17px} .hero h1{font-size:2.2rem} }
</style>
</head>
<body>

<nav aria-label="主選單">
  <div class="in">
    <a class="brand" href="#top">福岡</a>
    <a href="#flight" data-s="flight">航班</a>
    <a href="#plan" data-s="plan">行程</a>
    <a href="#hub" data-s="hub">清單</a>
    <a href="#stay" data-s="stay">住宿</a>
    <button type="button" class="editBtn" id="editBtn">編輯</button>
  </div>
</nav>

<main class="wrap" id="top">
<div class="card" id="edtool" hidden><p>編輯中：直接點文字修改，改動會先存在這支手機。要讓兩家都看到，按「下載新版」，再把檔案重新上傳覆蓋舊的。</p><button type="button" id="exBtn">下載新版</button><button type="button" id="rsBtn">還原成上傳的版本</button></div>

<!-- HERO -->
<div class="card hero">
  <svg viewBox="0 0 360 250" role="img" aria-label="福岡塔、海邊、飛機與電車的插圖" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="0" width="360" height="250" fill="#FFFCF6" stroke="none"/>
    <!-- sun -->
    <g transform="translate(70 62)">
      <g class="spin" stroke-dasharray="2 12" fill="none"><circle r="44"/></g>
      <circle r="28" fill="#F6D27A" class="bob"/>
    </g>
    <!-- clouds -->
    <g class="drift"><path d="M150 52c0-10 10-16 18-12 4-8 18-8 22 2 10-2 16 6 14 14h-52c-4 0-4-4-2-4z" fill="#fff"/></g>
    <g class="drift b"><path d="M262 96c0-8 8-12 14-9 3-6 14-6 17 2 8-1 12 5 11 11h-40c-3 0-3-3-2-4z" fill="#fff"/></g>
    <!-- plane -->
    <g class="fly"><g transform="translate(0 28)">
      <ellipse cx="30" cy="12" rx="24" ry="8" fill="#fff"/>
      <path d="M26 12 L18 -6 L30 -6 L40 12Z" fill="#A8D3E6"/>
      <path d="M8 10 L3 -2 L14 6Z" fill="#F2A497"/>
      <circle cx="38" cy="10" r="2" fill="#3E3A39" stroke="none"/><circle cx="46" cy="10" r="2" fill="#3E3A39" stroke="none"/>
    </g></g>
    <!-- sea -->
    <rect x="0" y="150" width="360" height="42" fill="#A8D3E6"/>
    <g fill="none"><path class="wave" d="M10 164q10-8 20 0t20 0 20 0 20 0"/><path class="wave b" d="M170 176q10-8 20 0t20 0 20 0 20 0"/><path class="wave" d="M40 182q10-8 20 0t20 0"/></g>
    <!-- ground -->
    <rect x="0" y="190" width="360" height="60" fill="#B9DAA5"/>
    <!-- tree -->
    <g><rect x="40" y="178" width="10" height="14" fill="#fff"/>
      <path d="M45 124 L68 160 H22Z" fill="#B9DAA5"/><path d="M45 142 L72 182 H18Z" fill="#B9DAA5"/>
      <path d="M45 108l3.5 7.5 8 1-6 5.5 1.800 8-7.300-4-7.300 4 1.800-8-6-5.500 8-1z" fill="#F6D27A" stroke-width="2.5" class="blink"/>
      <g stroke-width="2"><circle cx="38" cy="156" r="3.2" fill="#F2A497" class="blink"/><circle cx="53" cy="150" r="3.2" fill="#F6D27A" class="blink" style="animation-delay:-.8s"/><circle cx="31" cy="173" r="3.2" fill="#A8D3E6" class="blink" style="animation-delay:-1.500s"/><circle cx="48" cy="170" r="3.2" fill="#F2A497" class="blink" style="animation-delay:-.4s"/><circle cx="62" cy="174" r="3.2" fill="#A8D3E6" class="blink" style="animation-delay:-1.100s"/></g></g>
    <g><rect x="86" y="176" width="7" height="16" fill="#fff"/><circle cx="90" cy="170" r="12" fill="#B9DAA5"/></g>
    <!-- fukuoka tower -->
    <g>
      <line x1="263" y1="8" x2="263" y2="36"/>
      <path d="M263 36 L278 74 L286 190 L240 190 L248 74Z" fill="#fff"/>
      <path d="M252 90 H274 M250 120 H276 M247 150 H279" fill="none"/>
      <path d="M263 36 L270 55 H256Z" fill="#F2A497"/>
      <path d="M263 1l2.6 5.500 6 .8-4.400 4.100 1.100 6-5.300-3-5.300 3 1.100-6-4.400-4.100 6-.8z" fill="#F6D27A" stroke-width="2" class="blink"/>
      <g stroke-width="2"><circle cx="256" cy="56" r="3.2" fill="#F2A497" class="blink" style="animation-delay:-0.0s"/><circle cx="250" cy="82" r="3.2" fill="#F6D27A" class="blink" style="animation-delay:-0.4s"/><circle cx="247" cy="110" r="3.2" fill="#A8D3E6" class="blink" style="animation-delay:-0.7s"/><circle cx="244" cy="140" r="3.2" fill="#B9DAA5" class="blink" style="animation-delay:-1.1s"/><circle cx="241" cy="170" r="3.2" fill="#F2A497" class="blink" style="animation-delay:-1.5s"/><circle cx="270" cy="56" r="3.2" fill="#F6D27A" class="blink" style="animation-delay:-1.9s"/><circle cx="276" cy="82" r="3.2" fill="#A8D3E6" class="blink" style="animation-delay:-2.2s"/><circle cx="279" cy="110" r="3.2" fill="#B9DAA5" class="blink" style="animation-delay:-0.2s"/><circle cx="282" cy="140" r="3.2" fill="#F2A497" class="blink" style="animation-delay:-0.6s"/><circle cx="285" cy="170" r="3.2" fill="#F6D27A" class="blink" style="animation-delay:-0.9s"/></g>
    </g>
    <!-- track + sleigh -->
    <line x1="0" y1="232" x2="360" y2="232"/>
    <g class="fly2"><g transform="translate(0 213)"><g class="bob" stroke-width="2">
      <path d="M20 8H32" fill="none"/>
      <ellipse cx="12" cy="8" rx="9" ry="5" fill="#fff"/><circle cx="3" cy="3" r="4" fill="#fff"/>

const KEY='fk-trip-v1',CK='fk-checks';
const SEED=JSON.parse(document.getElementById('seed').textContent);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
let DATA=(()=>{try{const o=JSON.parse(store.get(KEY));if(o&&o.base===SEED.rev)return o.data}catch(e){}return clone(SEED)})();
const save=()=>{if(window.cloudSave)window.cloudSave(DATA);else store.set(KEY,JSON.stringify({base:SEED.rev,data:DATA}))};
let editing=false,cur=0,fcur=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=(p,v,ph)=>`<span class="e" data-p="${p}" data-ph="${esc(ph||'')}">${esc(v)}</span>`;
const V=(p,v)=>editing?E(p,v,'點此輸入'):(v?esc(v):'<span class="pending">待填</span>');
const ctl=(act,a,txt,cls='')=>`<button type="button" class="ed ${cls}" data-act="${act}" data-a="${a}">${txt}</button>`;
const PER={1:'上午',2:'下午',3:'晚上'};
const TI={
walk:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14" cy="4" r="2.2" fill="#fff"/><path d="M13 8l-3 5 3 3v6M13 8l3 4 3 1M10 13l-4 1M13 16l3 6"/></svg>`,
metro:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="4" fill="#fff"/><rect x="8" y="6" width="8" height="5" rx="1.5" fill="#A8D3E6"/><circle cx="9" cy="14" r="1" fill="#3E3A39"/><circle cx="15" cy="14" r="1" fill="#3E3A39"/><path d="M8 17l-2 4M16 17l2 4"/></svg>`,
train:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3M8 5h8"/><rect x="2" y="6" width="20" height="11" rx="4" fill="#fff"/><rect x="5" y="9" width="4" height="3" rx="1" fill="#A8D3E6"/><rect x="10" y="9" width="4" height="3" rx="1" fill="#A8D3E6"/><rect x="15" y="9" width="4" height="3" rx="1" fill="#A8D3E6"/><circle cx="7" cy="19" r="2" fill="#fff"/><circle cx="17" cy="19" r="2" fill="#fff"/></svg>`,
bus:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="3" fill="#fff"/><path d="M2 12h20"/><rect x="5" y="6.5" width="4" height="3" rx="1" fill="#A8D3E6"/><rect x="10" y="6.5" width="4" height="3" rx="1" fill="#A8D3E6"/><rect x="15" y="6.5" width="4" height="3" rx="1" fill="#A8D3E6"/><circle cx="7" cy="19" r="2" fill="#fff"/><circle cx="17" cy="19" r="2" fill="#fff"/></svg>`,
taxi:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="3" rx="1" fill="#F6D27A"/><path d="M3 16l2-6h14l2 6v2H3z" fill="#fff"/><path d="M7 10l1-3h8l1 3"/><circle cx="7.5" cy="18.5" r="2" fill="#fff"/><circle cx="16.5" cy="18.5" r="2" fill="#fff"/></svg>`,
plane:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 14l8-2-3-8h3l6 8 5-1a2 2 0 010 4l-5-1-6 8H7l3-8-8-2z" fill="#fff"/></svg>`
};
const TAGS=[['步行','walk'],['地鐵','metro'],['電車','train'],['巴士','bus'],['計程車','taxi'],['飛機','plane']];
const ICS=['plane','ball','whale','gundam','orbs','ramen','torii','bag'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const HSVG=`<svg viewBox="0 0 64 64" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="12" y="20" width="40" height="36" rx="6" fill="#A8D3E6"/><path d="M8 22 L32 6 L56 22Z" fill="#F2A497"/><rect x="26" y="38" width="12" height="18" rx="3" fill="#FFFCF6"/><rect x="17" y="28" width="9" height="8" rx="2" fill="#F6D27A"/><rect x="38" y="28" width="9" height="8" rx="2" fill="#F6D27A"/></svg>`;
function setP(p,v){const k=p.split('.');let o=DATA;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}

function rHero(){const m=DATA.meta;
  $('hT').innerHTML=E('meta.t1',m.t1)+'<br>'+E('meta.t2',m.t2);
  $('hS').innerHTML=E('meta.sub',m.sub);
  $('cdLabel').innerHTML=E('meta.cd',m.cd);
  $('hEd').innerHTML=editing?`<label class="edrow">出發時間（台灣時間）<br><input type="datetime-local" id="atIn" value="${esc(m.at)}"></label>`:'';
  document.title=m.t1+' '+m.t2}

function rTabsF(){$('ftabs').innerHTML=DATA.flights.map((f,i)=>`<button type="button" class="tab" role="tab" id="ftab${i}" aria-selected="${i===fcur}" data-f="${i}" style="min-width:110px"><b>${esc(f.who)}</b><span>${esc(f.air)}</span></button>`).join('')}
function rFlights(){
  fcur=Math.max(0,Math.min(fcur,DATA.flights.length-1));rTabsF();
  const f=DATA.flights[fcur];let h='';
  if(f){const b0='flights.'+fcur;
    if(editing)h+=`<div class="edbar">旅伴 ${E(b0+'.who',f.who)}　航空 ${E(b0+'.air',f.air)} ${ctl('delF',fcur,'刪除旅伴','del')}</div>`;
    h+=f.list.map((t,j)=>{const b=`${b0}.list.${j}`,a=`${fcur}.${j}`,dl=t.dir==='go'?'去程':'回程';
      return `<div class="card ticket ${t.dir}"><div class="side">${icons.plane}${editing?`<button type="button" class="pc" style="background:var(--paper)" data-act="dir" data-a="${a}">${dl}</button>`:`<small>${dl}</small>`}</div>
      <div class="body"><div class="route">${E(b+'.route',t.route,'路線')} <i>${E(b+'.date',t.date,'日期')}</i></div>
      <div class="rows">${t.rows.map((r,k)=>`<div><span>${E(`${b}.rows.${k}.0`,r[0],'項目')}</span><em>${V(`${b}.rows.${k}.1`,r[1])}${editing?ctl('delRow',`${a}.${k}`,'✕','x'):''}</em></div>`).join('')}</div>
      ${editing?ctl('addRow',a,'＋ 新增欄位','add')+ctl('delT',a,'刪除航班','del'):''}</div></div>`}).join('');
    if(editing)h+=ctl('addT',fcur,'＋ 新增航班','add')}
  if(editing)h+=ctl('addF',0,'＋ 新增旅伴','add');
  $('fpanel').innerHTML=h}

function rTabsD(){$('tabs').innerHTML=DATA.days.map((x,i)=>`<button type="button" class="tab" role="tab" id="tab${i}" aria-selected="${i===cur}" data-d="${i}">${x.tree?TT:''}<b>${esc(x.d)}</b><span>${esc(x.n)}</span></button>`).join('')}
const TT=`<i class="tabhat" aria-hidden="true"><svg viewBox="0 0 40 36" fill="none" stroke="#3E3A39" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><path d="M6 26C8 12 20 5 32 10c-5 5-4 11 2 16z" fill="#F2A497"/><rect x="3" y="24" width="34" height="9" rx="4.5" fill="#fff"/><circle cx="33" cy="9" r="5" fill="#fff"/></svg></i>`;
function rDays(){
  cur=Math.max(0,Math.min(cur,DATA.days.length-1));rTabsD();
  const x=DATA.days[cur];if(!x){$('panel').innerHTML=editing?ctl('addD',0,'＋ 新增一天','add'):'';return}
  const b='days.'+cur;
  let h=`<div class="dayhead"><div class="ic"${editing?` data-act="ic" data-a="${cur}" role="button" tabindex="0" title="點一下換圖"`:''}>${icons[x.ic]||''}</div><div><small>${E(b+'.d',x.d,'日期')}</small><h3>${E(b+'.title',x.title,'標題')}</h3></div></div>`;
  if(editing)h+=`<div class="edbar">分頁簡稱 ${E(b+'.n',x.n,'簡稱')}　<small>（點圖示可換圖）</small><br>${ctl('delD',cur,'刪除這一天','del')}${ctl('addD',0,'＋ 新增一天','add')}</div>`;
  h+=`<div class="note">重點：${E(b+'.note',x.note,'重點說明')}</div><ul class="tl">`+x.items.map((it,i)=>{
    const q=`${b}.items.${i}`,a=`${cur}.${i}`,tg=editing?'button type="button"':'span';
    const tags=(editing?TAGS:TAGS.filter(t=>it.tags.includes(t[1]))).map(t=>`<${tg} class="tag ${t[1]}${editing&&!it.tags.includes(t[1])?' off':''}"${editing?` data-act="tag" data-a="${a}.${t[1]}"`:''}>${TI[t[1]]}${t[0]}</${editing?'button':'span'}>`).join('');
    return `<li class="p${it.p}"><div class="it${it.must?' must':''}">${it.must?'<span class="badge">必去</span>':''}${editing?`<button type="button" class="pc" data-act="per" data-a="${a}">${PER[it.p]}</button>`:`<span class="pc">${PER[it.p]}</span>`}${it.time||editing?`<span class="pc" style="background:var(--paper)">${E(q+'.time',it.time,'時間')}</span>`:''}
    <h4>${E(q+'.t',it.t,'行程名稱')}</h4>${it.s||editing?`<p>${E(q+'.s',it.s,'說明')}</p>`:''}${tags?`<div class="tags">${tags}</div>`:''}
    ${editing?`<div class="ctl">${ctl('must',a,it.must?'取消必去':'設為必去')}${ctl('up',a,'↑')}${ctl('dn',a,'↓')}${ctl('delI',a,'刪除','del')}</div>`:''}</div></li>`}).join('')+'</ul>';
  if(editing)h+=ctl('addI',cur,'＋ 新增行程','add');
  $('panel').innerHTML=h}

function prog(){const all=document.querySelectorAll('#todoList input'),n=[...all].filter(c=>c.checked).length;
  $('progTx').textContent=`${n} / ${all.length}`;$('progBar').style.width=(all.length?n/all.length*100:0)+'%'}
function rTodo(){let done=new Set();try{done=new Set(JSON.parse(store.get(CK)||'[]'))}catch(e){}
  const T=editing?'div':'label';
  $('todoList').innerHTML=DATA.todos.map((t,i)=>`<li${editing?' class="edli"':''}><${T} class="lb"><input type="checkbox" data-i="${i}"${done.has(t)?' checked':''}><span class="box">${icons.check}</span><span class="tx">${E('todos.'+i,t,'待辦')}</span></${T}>${editing?`<span class="ctl">${ctl('up','todo.'+i,'↑')}${ctl('dn','todo.'+i,'↓')}${ctl('delTodo',i,'✕','del')}</span>`:''}</li>`).join('')+(editing?`<li>${ctl('addTodo',0,'＋ 新增待辦','add')}</li>`:'');
  prog()}

function nights(a,b){const p=s=>{const m=String(s).match(/(\d+)\/(\d+)/);return m?new Date(2001,m[1]-1,+m[2]):null},A=p(a),B=p(b);if(!A||!B)return '';let n=Math.round((B-A)/864e5);if(n<0)n+=365;return n+' 晚'}
const link=v=>/^\+?[\d\s()-]{7,}$/.test(v)?`<a href="tel:${esc(v.replace(/[^\d+]/g,''))}">${esc(v)}</a>`:esc(v);
function rStay(){const s=DATA.stay;
  $('stayBox').innerHTML=`<div class="card stay"><h3>${HSVG}<span>${E('stay.name',s.name,'住宿名稱')}</span></h3>
  <p style="margin-top:6px"><span class="pending" style="border-style:solid;background:var(--yellow)">${E('stay.badge',s.badge,'標籤')}</span> <a class="pending" style="border-style:solid;text-decoration:none;background:var(--blue)" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' '+s.address)}" target="_blank" rel="noopener">查看地圖</a></p>
  ${s.guests.map((g,i)=>`<div class="who">${E(`stay.guests.${i}.who`,g.who,'姓名')}${editing?ctl('delG',i,'✕','x'):''}</div><div class="dates"><div><small>入住</small>${E(`stay.guests.${i}.in`,g.in,'M/D')}</div><div class="n">${nights(g.in,g.out)}</div><div><small>退房</small>${E(`stay.guests.${i}.out`,g.out,'M/D')}</div></div>`).join('')}
  ${editing?ctl('addG',0,'＋ 新增住客','add'):''}
  <dl><div><dt>地址</dt><dd>${E('stay.address',s.address,'地址')}</dd></div>${s.rows.map((r,i)=>`<div><dt>${E(`stay.rows.${i}.0`,r[0],'項目')}</dt><dd>${editing?E(`stay.rows.${i}.1`,r[1],'內容')+ctl('delSR',i,'✕','x'):link(r[1])}</dd></div>`).join('')}</dl>
  ${editing?ctl('addSR',0,'＋ 新增資訊','add'):''}</div>`}

const mapUrl=(it,g)=>/^https?:\/\//.test(it.m||'')?it.m:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((it.n||'')+' '+((g&&g.k)||'福岡'));
function rFood(){const F=DATA.food=DATA.food||[],TP=DATA.tips=DATA.tips||[];let done=[];try{done=JSON.parse(store.get('fk-food')||'[]')}catch(e){}
  const T=editing?'div':'label';
  $('foodBox').innerHTML='<p class="foot">打勾代表已吃過或已買，只記在你自己的手機上。資料整理自網友圖片，營業時間與公休日請以 Google 地圖和現場為準。</p>'+F.map((g,gi)=>`<h3 class="fg">${E('food.'+gi+'.g',g.g,'分類')}</h3>${editing?ctl('delFG',gi,'刪除分類','del'):''}<ul class="todo">${g.items.map((it,i)=>`<li class="edli"><${T} class="lb"><input type="checkbox" data-fk="${gi}.${i}"${done.includes(it.n)?' checked':''}><span class="box">${icons.check}</span><span class="tx"><b>${E(`food.${gi}.items.${i}.n`,it.n,'店名')}</b><span class="wp">${E(`food.${gi}.items.${i}.t`,it.t,'類型')}</span><small>${E(`food.${gi}.items.${i}.s`,it.s,'簡介')}</small>${editing?`<small>地圖連結：${E(`food.${gi}.items.${i}.m`,it.m||'','空白＝用店名搜尋')}</small>`:''}</span></${T}><a class="mp" href="${esc(mapUrl(it,g))}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.500 7 12 7 12z" fill="#F2A497"/><circle cx="12" cy="10" r="2.5" fill="#fff"/></svg>地圖</a>${editing?ctl('delFI',gi+'.'+i,'✕','del'):''}</li>`).join('')}</ul>${editing?ctl('addFI',gi,'＋ 新增店家','add'):''}`).join('')+(editing?ctl('addFG',0,'＋ 新增分類','add'):'')+(TP.length||editing?`<h3 class="fg">小撇步</h3><ul class="tips">${TP.map((t,i)=>`<li>${E('tips.'+i,t,'內容')}${editing?ctl('delTip',i,'✕','x'):''}</li>`).join('')}</ul>${editing?ctl('addTip',0,'＋ 新增小撇步','add'):''}`:'')}
function fixEd(){document.querySelectorAll('.e').forEach(e=>{try{e.contentEditable=editing?'plaintext-only':'false'}catch(_){e.contentEditable=editing?'true':'false'}})}
function render(){rHero();rFlights();rDays();rTodo();rStay();rFood();fixEd()}

function bump(tid,pid){const t=$(tid),p=$(pid);if(t)t.scrollIntoView({inline:'center',block:'nearest'});
  if(reduce.matches)return;if(t)t.classList.add('bounce');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}

document.addEventListener('click',ev=>{
  const tab=ev.target.closest('.tab');
  if(tab){if(tab.dataset.d!==undefined){cur=+tab.dataset.d;rDays();fixEd();bump('tab'+cur,'panel')}else{fcur=+tab.dataset.f;rFlights();fixEd();bump('ftab'+fcur,'fpanel')}return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,[i,j,k]=String(el.dataset.a).split('.'),ti=+i,tj=+j,D=DATA;
  switch(act){
    case 'ic':{const x=D.days[ti];x.ic=ICS[(ICS.indexOf(x.ic)+1)%ICS.length];break}
    case 'per':{const it=D.days[ti].items[tj];it.p=it.p%3+1;break}
    case 'tag':{const t=D.days[ti].items[tj].tags,p=t.indexOf(k);p<0?t.push(k):t.splice(p,1);break}
    case 'must':{const it=D.days[ti].items[tj];it.must=!it.must;break}
    case 'up':case 'dn':{const arr=i==='todo'?D.todos:D.days[ti].items,n=tj+(act==='up'?-1:1);if(n<0||n>=arr.length)return;[arr[tj],arr[n]]=[arr[n],arr[tj]];break}
    case 'delI':if(!confirm('刪除這個行程？'))return;D.days[ti].items.splice(tj,1);break;
    case 'addI':D.days[ti].items.push({p:1,time:'',t:'新行程',s:'',tags:[],must:false});break;
    case 'delD':if(!confirm('刪除這一天和裡面所有行程？'))return;D.days.splice(ti,1);break;
    case 'addD':D.days.push({d:'日期',n:'新一天',ic:'plane',title:'新的一天',note:'',items:[]});cur=D.days.length-1;break;
    case 'dir':{const t=D.flights[ti].list[tj];t.dir=t.dir==='go'?'back':'go';break}
    case 'delRow':D.flights[ti].list[tj].rows.splice(+k,1);break;
    case 'addRow':D.flights[ti].list[tj].rows.push(['','']);break;
    case 'delT':if(!confirm('刪除這個航班？'))return;D.flights[ti].list.splice(tj,1);break;
    case 'addT':D.flights[ti].list.push({dir:'go',date:'',route:'',rows:[['航班','']]});break;
    case 'delF':if(!confirm('刪除這位旅伴的航班？'))return;D.flights.splice(ti,1);break;
    case 'addF':D.flights.push({who:'新旅伴',air:'航空公司',list:[]});fcur=D.flights.length-1;break;
    case 'delTodo':D.todos.splice(ti,1);break;
    case 'addTodo':D.todos.push('新待辦');break;
    case 'delG':D.stay.guests.splice(ti,1);break;
    case 'addG':D.stay.guests.push({who:'姓名',in:'',out:''});break;
    case 'delSR':D.stay.rows.splice(ti,1);break;
    case 'addSR':D.stay.rows.push(['項目','']);break;
    case 'delFI':D.food[ti].items.splice(tj,1);break;
    case 'addFI':D.food[ti].items.push({n:'店名',t:'類型',s:'簡介'});break;
    case 'delFG':if(!confirm('刪除這個分類？'))return;D.food.splice(ti,1);break;
    case 'addFG':D.food.push({g:'新分類',items:[]});break;
    case 'delTip':D.tips.splice(ti,1);break;
    case 'addTip':D.tips.push('新小撇步');break;
    default:return}
  save();render()});
document.addEventListener('focusout',ev=>{const el=ev.target;if(!el.classList||!el.classList.contains('e'))return;
  const p=el.dataset.p;setP(p,el.textContent.replace(/\s+/g,' ').trim());save();
  if(/^days\.\d+\.(d|n)$/.test(p))rTabsD();if(/^flights\.\d+\.(who|air)$/.test(p))rTabsF();
  if(p.indexOf('stay.guests')===0)rStay(),fixEd();if(p==='meta.t1'||p==='meta.t2')document.title=DATA.meta.t1+' '+DATA.meta.t2});
document.addEventListener('keydown',ev=>{if(ev.target.classList&&ev.target.classList.contains('e')&&ev.key==='Enter'){ev.preventDefault();ev.target.blur()}
  if(ev.key==='Enter'&&ev.target.dataset&&ev.target.dataset.act==='ic')ev.target.click()});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='atIn'){DATA.meta.at=t.value;save()}
  if(t.matches&&t.matches('#foodBox input')){let d=[];try{d=JSON.parse(store.get('fk-food')||'[]')}catch(e){}
    const [a,b]=t.dataset.fk.split('.'),nm=DATA.food[+a].items[+b].n;d=d.filter(x=>x!==nm);if(t.checked)d.push(nm);store.set('fk-food',JSON.stringify(d))}
  if(t.matches&&t.matches('#todoList input')){let d=[];try{d=JSON.parse(store.get(CK)||'[]')}catch(e){}
    const txt=DATA.todos[+t.dataset.i];d=d.filter(x=>x!==txt);if(t.checked)d.push(txt);store.set(CK,JSON.stringify(d));prog()}});

function setEdit(on){editing=on;document.body.classList.toggle('editing',on);$('edtool').hidden=!on;$('editBtn').textContent=on?'完成':'編輯';render();window.scrollTo({top:0})}
$('editBtn').onclick=()=>{if(!editing&&window.cloudGate&&!window.cloudGate())return;setEdit(!editing)};
window.App={setData(d){DATA=d;render()},setEdit,get editing(){return editing}};
$('rsBtn').onclick=()=>{if(!confirm('還原成網頁上傳時的版本？你在這支手機上的修改會消失。'))return;store.del(KEY);DATA=clone(SEED);render()};
$('exBtn').onclick=()=>{
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#seed').textContent=JSON.stringify({...DATA,rev:Date.now()}).replace(/</g,'\\u003c');
  c.querySelector('body').classList.remove('editing');c.querySelector('#edtool').hidden=true;c.querySelector('#editBtn').textContent='編輯';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}));
  a.download='fukuoka-trip.html';document.body.appendChild(a);a.click();a.remove()};

(function(){const pad=n=>String(n).padStart(2,'0');
  function tick(){const go=new Date(DATA.meta.at+':00+08:00');if(isNaN(go))return;
    const now=new Date(),diff=go-now,cd=$('cd'),msg=$('cdMsg');
    cd.style.display=diff>0?'':'none';$('cdLabel').style.display=diff>0?'':'none';
    msg.style.display=diff>0?'none':'block';msg.textContent=-diff>=6*864e5?'旅程結束，平安回家！':'旅程進行中，玩得開心！';
    if(diff>0){const t=Math.floor(diff/1000);
      $('cd-d').textContent=Math.floor(t/86400);$('cd-h').textContent=pad(Math.floor(t%86400/3600));
      $('cd-m').textContent=pad(Math.floor(t%3600/60));$('cd-s').textContent=pad(t%60)}}
  tick();setInterval(tick,1000)})();
(function(){const links=[...document.querySelectorAll('nav a[data-s]')];
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.s===e.target.id))})},{rootMargin:'-30% 0px -60% 0px'});
  links.forEach(a=>io.observe($(a.dataset.s)))})();
$('hubTabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;const k=b.dataset.h;
  [...$('hubTabs').children].forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=='p-'+k);bump('htab-'+k,'p-'+k)});
render();

</script>
